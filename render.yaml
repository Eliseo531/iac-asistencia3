databases:
  - name: asistencia-db
    databaseName: asistencia_db
    user: postgres
    plan: free
    region: oregon

services:
  - type: web
    name: iac-asistencia-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: FRONTEND_URL
        sync: false
